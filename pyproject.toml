[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-agent"
version = "0.1.0"
description = "Claim knowledge base ingestion and cited local research agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-ai-projects>=2.2.0",
    "azure-identity>=1.17.0",
    "chromadb>=1.0.0",
    "lightrag-hku==1.5.4",
    # The target Windows policy blocks the NumPy 2.5 wheel's native modules.
    "numpy>=1.24,<2.5",
    "openai>=2.44.0",
    "pydantic>=2.12",
    "pydantic-ai-slim[openai]>=2.8,<3",
    "pydantic-deep==0.3.35",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "snowflake-snowpark-python>=1.35.0",
    "streamlit>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["knowledge_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_api_key_ingestion: calls NVIDIA and Azure Document Intelligence",
    "live_nvidia: calls NVIDIA DeepSeek V4 Pro",
    "live_azure: calls the configured live Azure AI Projects deployment",
    "live_snowflake: calls Snowflake Cortex REST or AI_PARSE_DOCUMENT",
]
